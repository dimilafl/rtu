[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-quality-engine"
version = "1.0.0"
description = "DSP-style signal conditioning and diagnostics for SCADA telemetry"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "numpy>=1.20.0",
  "pyyaml>=5.4.0",
]
authors = [{name = "Signal Quality Engine contributors"}]
keywords = ["scada", "dsp", "signal-processing", "telemetry", "rtu", "plc"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Scientific/Engineering",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Operating System :: OS Independent",
]

[project.urls]
Documentation = "https://github.com/dimilafl/rtu/tree/main/sqe/docs"
Source = "https://github.com/dimilafl/rtu"
Tracker = "https://github.com/dimilafl/rtu/issues"

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "pytest-cov>=3.0.0",
  "black>=22.0.0",
  "flake8>=4.0.0",
  "mypy>=0.950",
]
plot = [
  "matplotlib>=3.5.0",
]
all = [
  "pytest>=7.0.0",
  "pytest-cov>=3.0.0",
  "matplotlib>=3.5.0",
]

[project.scripts]
sqe = "sqe.cli.sqe_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sqe*"]

[tool.setuptools.package-data]
sqe = ["config/*.yaml"]
