# Signal Quality Engine Default Configuration

# Engine settings
engine:
  scan_interval: 0.1  # seconds (100ms)
  auto_register: true  # Automatically register unknown signals
  treat_missing_signals_as_none: true
  unknown_signal_policy: error
  max_signals_policy: error

# Filter settings
filters:
  default_ewma_alpha: 0.3  # EWMA smoothing factor
  default_ma_window: 10    # Moving average window size

# Drift detection settings
drift:
  small_threshold: 0.5      # Sustained small drift threshold
  large_threshold: 5.0      # Transient large drift threshold
  sustained_window: 10      # Samples to consider "sustained"
  monotonic_window: 5       # Samples to detect monotonic behavior

# Variance and spike detection settings
variance:
  default_window: 20        # Variance calculation window
  spike_k_sigma: 3.0        # Spike threshold (std deviations)
  debounce_samples: 2       # Consecutive samples to confirm spike

# Innovation model settings (config-only; runtime integration is gated)
innovation:
  enabled: false
  q: 0.01
  r: 1.0
  beta: 0.05
  s_min: 1.0e-12
  p0_var: 1.0e6
  v0_var: 1.0e4
  z_spike: 6.0
  noise_threshold: 1.0

# Stale detection settings
stale:
  window: 5                 # Identical samples to flag flatline
  recovery_window: 3        # Non-stale samples to clear

# Step-change detection settings
step_change:
  baseline_window: 10       # Samples for baseline mean
  threshold: 5.0            # Absolute change to flag step
  persistence_scans: 3      # Scans to confirm step
  recovery_scans: 5         # Scans to accept new baseline

# Plausibility settings
plausibility:
  default:
    min: null               # Engineering min (optional)
    max: null               # Engineering max (optional)
    max_rate: null          # Max rate-of-change per second (optional)
    persistence_scans: 1    # Scans to confirm violation
    recovery_scans: 1       # Scans to clear violation
  by_signal: {}             # Per-signal overrides
  by_prefix: {}             # Per-prefix overrides

# Frequency detection settings
frequency:
  default_references:       # Default reference frequencies (Hz)
    []
  window_size: 50           # Correlation window size
  threshold: 0.5            # Detection threshold
  enable_fft: false         # Enable FFT-based analysis

# Signal Quality Index settings
sqi:
  weights:
    noise: 0.25             # Weight for noise component
    drift: 0.25             # Weight for drift component
    spikes: 0.20            # Weight for spike component
    oscillation: 0.15       # Weight for oscillation component
    missing: 0.15           # Weight for missing samples component
    stale: 0.0              # Weight for stale component
    step: 0.0               # Weight for step-change component
    plausibility: 0.0       # Weight for plausibility component

  thresholds:
    noise: 0.1              # Noise threshold (CV)
    drift: 1.0              # Drift threshold
    spike_frequency: 0.05   # Spike frequency threshold
    oscillation: 0.3        # Oscillation energy threshold

  classification:
    excellent: 90           # SQI >= 90
    good: 75                # SQI >= 75
    fair: 50                # SQI >= 50
    poor: 25                # SQI >= 25
    # Below 25 is critical

# Integration adapter settings
integration:
  pointcore:
    auto_register_points: true
    default_point_type: "AI"

  plcscan:
    enable_callbacks: true
    track_performance: true
    warn_on_overrun: true
    max_scan_history: 100

  comms:
    track_jitter: true
    track_dropouts: true
    track_late_arrivals: true
    quality_monitor_window: 100
    max_rtt_ms: 500.0
    max_jitter_ms: 200.0
    max_dropout_streak: 3

# Comms health settings
comms:
  enabled: false
  thresholds:
    timeout_rate_degraded: 0.02
    timeout_rate_critical: 0.10
    retry_rate_degraded: 0.05
    retry_rate_critical: 0.20
    crc_rate_degraded: 0.001
    crc_rate_critical: 0.01
    jitter_ms_degraded: 250
    jitter_ms_critical: 750
    poll_cycle_ms_degraded: 2000
    poll_cycle_ms_critical: 5000
  report:
    top_n: 10
  budget:
    enabled: false
    scan_interval_ms: 1000
    bytes_per_signal_estimate: 18
    protocol_overhead_bytes: 200
    default_capacity_bps_by_type:
      comms_domain: 9600
      poll_group: 9600
      rtu: 9600
    per_node_capacity_bps: {}
    thresholds:
      utilization_degraded: 0.70
      utilization_critical: 0.90
      low_headroom: 0.10

# Logging settings
logging:
  level: "INFO"             # DEBUG, INFO, WARNING, ERROR
  log_scan_timing: false
  log_quality_changes: true
  log_anomalies: true

# Performance settings
performance:
  max_signals: 1000         # Maximum number of signals
  buffer_preallocation: true
  use_numpy: true           # Use numpy for calculations
  compute_budget_ms: null   # Optional compute budget per signal scan (ms)
  load_shed_p95_window: 50  # Window size for scan-duration p95
  load_shed_oscillation_cadence: 3
  load_shed_skip_fft: true


# Alert settings
alerts:
  enable: true
  sqi_critical_threshold: 25
  sqi_warning_threshold: 50
  drift_alert_threshold: 5.0
  spike_alert_threshold: 0.1  # 10% spike frequency

# Incident policy settings
incidents:
  start_sqi_threshold: 50
  end_sqi_threshold: 60
  start_persistence_scans: 5
  end_persistence_scans: 10
  critical_sqi_threshold: 25
  component_score_floor: 70
  state_retention_scans: 100000
  hard_fault_causes:
    - "missing"
  emit_update_on_cause_change: true
  emit_update_on_severity_change: true

# Event filtering settings
event_filter:
  suppress_member_events: true
  suppress_when_group_event_active: true
  suppress_group_causes:
    - "comms"
  suppress_event_types:
    - "started"
    - "updated"
  allow_resolved_passthrough: true
  include_suppression_stats: true

# Topology settings
topology:
  enabled: false
  path: ""
  allow_orphan_signals: false
  node_type_priority:
    - comms_domain
    - poll_group
    - rtu
    - signal

# Root Cause Analysis settings
rca:
  enabled: false

  affected_policy:
    use_active_incidents: true
    use_quality_class: true
    affected_classes:
      - "POOR"
      - "BAD"
    missing_ratio_threshold: 0.2

  representative_signals_max: 12
  supporting_incidents_max: 30
  retention_scans: 2000

  scoring:
    weights:
      coverage: 0.45
      concentration: 0.25
      coherence: 0.20
      signature: 0.10
    coherence_k_scans: 5
    min_fraction_by_type:
      comms_domain: 0.25
      poll_group: 0.25
      rtu: 0.50
      signal: 1.00
    type_score_norm:
      comms_domain:
        floor: 0.0
        ceiling: 1.2
      poll_group:
        floor: 0.0
        ceiling: 1.2
      rtu:
        floor: 0.0
        ceiling: 1.2
      signal:
        floor: 0.0
        ceiling: 1.2

  comms_scoring:
    enabled: true
    leaf_comms_gate: 0.35
    coherence_k_scans: 4
    weights:
      comms_boost: 0.35
      comms_counter: 0.25
    node_type_multiplier:
      comms_domain: 1.0
      poll_group: 1.0
      rtu: 0.5
      signal: 0.0
    leaf_likeness_weights:
      missing_fraction: 0.6
      coherence: 0.5
      non_missing_fraction: 0.9
    normalization:
      utilization_degraded: 0.70
      utilization_critical: 0.90
      timeout_rate_degraded: 0.02
      timeout_rate_critical: 0.10
      jitter_ms_degraded: 250
      jitter_ms_critical: 750

  confidence:
    required_scans: 2
    margin_scale: 0.2

  node_incidents:
    enabled: true
    start_persistence_scans: 2
    resolve_persistence_scans: 2
    cooldown_scans: 5
    min_confidence_to_start: 0.75
    emit_updates: true
