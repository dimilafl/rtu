engine:
  scan_interval: 0.1
  auto_register: true
logging:
  log_scan_timing: false
  log_quality_changes: false
  log_anomalies: false
performance:
  max_signals: 1000
incidents:
  start_sqi_threshold: 50
  end_sqi_threshold: 60
  start_persistence_scans: 1
  end_persistence_scans: 1
  critical_sqi_threshold: 25
  component_score_floor: 70
  emit_update_on_cause_change: true
  emit_update_on_severity_change: true
